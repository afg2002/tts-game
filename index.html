<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTS Terminologi Kesehatan — S1 Keperawatan</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Segoe UI,Arial,sans-serif}
header{background:linear-gradient(135deg,#2457d6,#117c73);color:white;padding:28px 20px}
.wrap,main{max-width:1250px;margin:auto}
h1{margin:0;font-size:30px}.subtitle{margin-top:5px;opacity:.9}
main{padding:20px 15px 50px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}
select,button{font:inherit;padding:10px 13px;border:1px solid #d5dce8;border-radius:10px;background:white;cursor:pointer}
button.primary{background:#2563eb;color:white;border-color:#2563eb}
button.good{background:#16a34a;color:white;border-color:#16a34a}
.card{background:white;border:1px solid #d7deea;border-radius:16px;padding:17px;margin-bottom:16px;box-shadow:0 5px 18px #0000000a}
.info{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.stats{color:#667085;margin-top:8px}
.layout{display:grid;grid-template-columns:minmax(420px,1fr) minmax(460px,1fr);gap:16px}
@media(max-width:1000px){.layout{grid-template-columns:1fr}}
.gridbox{overflow:auto;background:#fafafa;border:1px solid #d7deea;border-radius:12px;padding:14px;min-height:500px}
.crossword{display:grid;gap:2px;width:max-content;margin:auto}
.cell{width:31px;height:31px;background:white;border:1px solid #cbd5e1;position:relative}
.cell.block{background:#182033;border-color:#182033}
.cell input{width:100%;height:100%;border:0;outline:none;background:transparent;text-align:center;font-size:17px;font-weight:700;text-transform:uppercase}
.cell.active{outline:3px solid #60a5fa;z-index:2}
.cell.correct{background:#dcfce7}.cell.wrong{background:#fee2e2}
.num{position:absolute;left:3px;top:1px;font-size:8px;color:#64748b;z-index:2;pointer-events:none}
.clue-panel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.clue-panel{grid-template-columns:1fr}}
.clue-group h3{margin:0 0 10px}
.clues{max-height:650px;overflow:auto;padding-right:3px}
.clue{padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;margin-bottom:8px;cursor:pointer;line-height:1.4}
.clue:hover{background:#eff6ff;border-color:#93c5fd}
.clue b{color:#2563eb}
.clue .answerlen{color:#667085;font-size:12px}
.result{border-left:5px solid #2563eb}
.score{font-size:34px;font-weight:800;color:#2563eb}
.source-note{font-size:13px;color:#667085}

.identity-card{padding:16px 18px}
.identity-title{font-size:16px;font-weight:700;margin-bottom:12px}
.identity-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
.identity-grid label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#475467}
.identity-grid input{font:inherit;font-weight:400;padding:10px 12px;border:1px solid #d5dce8;border-radius:9px;outline:none;background:#fff}
.identity-grid input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
@media(max-width:700px){.identity-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
<h1>🩺 TTS Terminologi Kesehatan</h1>
<div class="subtitle">Program Studi S1 Keperawatan · 11 Materi</div>
</div></header>

<main>
<div class="toolbar">
<select id="material"></select>
<button class="primary" onclick="checkAnswers()">✓ Cek Jawaban</button>
<button onclick="resetPuzzle()">↻ Reset</button>
<button class="good" onclick="showAnswers()">🔑 Kunci Jawaban</button>
</div>

<div class="card identity-card">
  <div class="identity-title">Identitas Mahasiswa</div>
  <div class="identity-grid">
    <label><span>Nama</span><input id="studentName" type="text" placeholder="Masukkan nama"></label>
    <label><span>NIM</span><input id="studentNim" type="text" placeholder="Masukkan NIM"></label>
    <label><span>Kelas</span><input id="studentClass" type="text" placeholder="Masukkan kelas"></label>
  </div>
</div>

<div class="card info">
<div>
<span class="badge" id="title"></span>
<h2 style="margin:10px 0 4px">Kerjakan TTS</h2>
<div class="stats">
Soal: <b id="questionCount">0</b> ·
Terisi: <b id="filled">0</b> ·
Benar: <b id="correct">0</b> ·
Nilai: <b id="score">0</b>
</div>
</div>

</div>

<div class="layout">
<section class="card">
<div class="gridbox"><div id="grid" class="crossword"></div></div>
</section>

<section class="card">
<div class="clue-panel">
<div class="clue-group">
<h3>➡️ Mendatar</h3>
<div id="across" class="clues"></div>
</div>
<div class="clue-group">
<h3>⬇️ Menurun</h3>
<div id="down" class="clues"></div>
</div>
</div>
</section>
</div>

<div id="result" class="card result" style="display:none"></div>
</main>

let current=0;
let cells={};

const select=document.getElementById('material');
MATERIALS.forEach((m,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=(i+1)+'. '+m.name;
  select.appendChild(o);
});
select.onchange=()=>loadMaterial(Number(select.value));

function numberForStart(m,r,c){
  const starts=[];
  Object.values(m.positions).forEach(p=>{
    if(!starts.some(x=>x[0]===p[0]&&x[1]===p[1])) starts.push([p[0],p[1]]);
  });
  starts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const idx=starts.findIndex(x=>x[0]===r&&x[1]===c);
  return idx<0?'':idx+1;
}

function loadMaterial(index){
  current=index;
  const m=MATERIALS[index];
  cells={};

  document.getElementById('title').textContent=m.name;
  document.getElementById('questionCount').textContent=m.across.length+m.down.length;

  const grid=document.getElementById('grid');
  grid.innerHTML='';
  grid.style.gridTemplateColumns='repeat('+m.cols+',31px)';

  for(let r=0;r<m.rows;r++){
    for(let c=0;c<m.cols;c++){
      const d=document.createElement('div');
      d.className='cell';
      const key=r+','+c;

      if(m.grid[key]===undefined){
        d.classList.add('block');
      }else{
        const n=numberForStart(m,r,c);
        if(n){
          const s=document.createElement('span');
          s.className='num';
          s.textContent=n;
          d.appendChild(s);
        }

        const input=document.createElement('input');
        input.maxLength=1;
        input.autocomplete='off';
        input.onfocus=()=>{
          document.querySelectorAll('.cell').forEach(x=>x.classList.remove('active'));
          d.classList.add('active');
        };
        input.oninput=()=>{
          input.value=input.value.replace(/[^a-z]/gi,'').toUpperCase();
          updateStats();
        };
        d.appendChild(input);
        cells[key]=input;
      }
      grid.appendChild(d);
    }
  }

  renderClues('across');
  renderClues('down');
  resetResult();
  updateStats();
}

function renderClues(type){
  const el=document.getElementById(type);
  el.innerHTML='';
  MATERIALS[current][type].forEach((q,i)=>{
    const p=MATERIALS[current].positions[type+'_'+i];
    const d=document.createElement('div');
    d.className='clue';
    d.innerHTML='<b>'+numberForStart(MATERIALS[current],p[0],p[1])+'.</b> '
      +escapeHtml(q.question)
      +' <span class="answerlen">['+q.letters+' huruf]</span>';
    d.onclick=()=>focusWord(type,i);
    el.appendChild(d);
  });
}

function focusWord(type,index){
  const m=MATERIALS[current];
  const p=m.positions[type+'_'+index];
  const q=m[type][index];
  for(let k=0;k<q.answer.length;k++){
    const key=(p[0]+p[2]*k)+','+(p[1]+p[3]*k);
    if(cells[key]){
      cells[key].focus();
      break;
    }
  }
}

function checkAnswers(){
  const m=MATERIALS[current];
  let correct=0,total=0;

  ['across','down'].forEach(type=>{
    m[type].forEach((q,i)=>{
      const p=m.positions[type+'_'+i];
      for(let k=0;k<q.answer.length;k++){
        const key=(p[0]+p[2]*k)+','+(p[1]+p[3]*k);
        const input=cells[key];
        if(!input) continue;

        total++;
        input.parentElement.classList.remove('correct','wrong');
        if(input.value===q.answer[k]){
          correct++;
          input.parentElement.classList.add('correct');
        }else{
          input.parentElement.classList.add('wrong');
        }
      }
    });
  });

  const score=total?Math.round(correct/total*100):0;
  document.getElementById('correct').textContent=correct;
  document.getElementById('score').textContent=score;

  const result=document.getElementById('result');
  result.style.display='block';
  result.innerHTML='<div class="score">'+score+'</div>'
    +'<b>'+correct+' huruf benar dari '+total+' posisi.</b>'
    +'<p>Hijau = benar · Merah = salah.</p>';
}

function showAnswers(){
  const m=MATERIALS[current];

  ['across','down'].forEach(type=>{
    m[type].forEach((q,i)=>{
      const p=m.positions[type+'_'+i];
      for(let k=0;k<q.answer.length;k++){
        const key=(p[0]+p[2]*k)+','+(p[1]+p[3]*k);
        if(cells[key]) cells[key].value=q.answer[k];
      }
    });
  });

  updateStats();
}

function resetPuzzle(){
  Object.values(cells).forEach(input=>{
    input.value='';
    input.parentElement.classList.remove('correct','wrong');
  });
  resetResult();
  updateStats();
}

function resetResult(){
  document.getElementById('result').style.display='none';
  document.getElementById('correct').textContent='0';
  document.getElementById('score').textContent='0';
}

function updateStats(){
  document.getElementById('filled').textContent=
    Object.values(cells).filter(x=>x.value).length;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

loadMaterial(0);
